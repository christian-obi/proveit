[package]
name = "proveit-registry"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.86"
description = "Prove-It registry: records enclave-signed trading cards on NEAR and verifies them"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.9.0"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.9.0", features = ["unit-testing"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
