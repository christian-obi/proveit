[package]
name = "s2-enclave"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "P0 spikes S2/S3/S5: signing and MAC keys, encrypted secrets, and output sizes on OutLayer"

[[bin]]
name = "s2-enclave"
path = "src/main.rs"

[features]
# Changes one constant only, so the same code gets a second sha256 ("a new version").
v2 = []

[dependencies]
# Bindings come from wit/, copies of the worker's worker/wit/deps/*.wit.
wit-bindgen = "0.36"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
sha2 = "0.10"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
