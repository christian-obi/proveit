name: ci

on:
  push:
  pull_request:

jobs:
  enclave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: enclave
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # P1 exit tests (and the cargo tests for T2.1–T2.4) except T1.9, which needs the live leaderboard.
      - run: OFFLINE=1 scripts/p1-check.sh

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # contract/rust-toolchain.toml pins Rust 1.86; rustup on the runner picks it up.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract
      # P3: registry checks driven through the real callback with mocked OutLayer results.
      - run: cd contract && cargo test

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # S3: browser-side encryption to the OutLayer keystore (offline cases only).
      - run: OFFLINE=1 node --test spikes/s3-secrets/test.mjs
      # P2: test vectors in sync; the TypeScript verifier accepts Rust- and TEE-signed cards.
      - run: SKIP_BUILD=1 scripts/p2-check.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # T5.1, T5.2 and the transaction / relay checks.
      - run: pnpm --filter web test
      - run: pnpm --filter web build
      # T5.3: the live create flow in a real browser; the address must never reach the app's server.
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web e2e

  reproducible-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bytecodealliance/actions/wasm-tools/setup@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # T2.5/T2.6: rebuild in the pinned image; the hashes must equal enclave/expected-hashes.txt.
      - run: scripts/p2-check.sh
